aid: knewton
name: Knewton
description: 'Knewton is an adaptive learning technology company founded in 2008 in New York City and
  acquired by John Wiley & Sons in 2019, where it now ships as the Knewton alta courseware line. Its
  developer-facing product is the Knewton Enterprise Platform API, documented at dev.knewton.com, which
  lets partner learning applications send learner interaction and performance data to Knewton and receive
  continuously personalized content recommendations and predictive analytics in return. The platform maps
  the pedagogical relationships between concepts in a partner catalog into a knowledge graph, then uses
  it to recommend modules, track goal status and progress, and generate predicted scores. The REST API
  is versioned at v0, uses OAuth 2.0 client-credentials tokens, and exposes accounts, learning instances,
  registrations, scoped goals, graded and ungraded student events, recommendations, status-and-progress
  metrics, and predicted score.'
