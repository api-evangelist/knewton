standards:
- id: oauth2
  conforms: true
  evidence: OAuth 2.0 token endpoint POST /oauth/token supporting the client_credentials and
    refresh_token grants, with client authentication via HTTP Basic.
  source: https://dev.knewton.com/reference/authentication/
- id: oauth2-client-credentials
  conforms: true
  evidence: grant_type=client_credentials documented.
  source: https://dev.knewton.com/reference/authentication/
- id: oauth2-scopes
  conforms: false
  evidence: The scope parameter is overloaded to carry an external user account ID rather
    than a permission scope; no scope registry is published.
- id: rfc8414-oauth-authorization-server-metadata
  conforms: false
  evidence: /.well-known/oauth-authorization-server returned 404 on api.knewton.com and
    dev-api.knewton.com.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returned 404; no ID tokens or userinfo endpoint
    documented.
- id: rfc9457-problem-details
  conforms: false
  evidence: Errors are application/json with message and error_id fields; no
    application/problem+json media type is documented.
- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returned 404 on all probed Knewton hosts.
- id: rfc8594-sunset-header
  conforms: false
  evidence: The API versioning policy documents a release-candidate and LTS support window
    but no Sunset or Deprecation response headers.
- id: rest-json
  conforms: true
  evidence: Resource-oriented JSON REST over HTTPS; application/json is the only supported
    content type.
  source: https://dev.knewton.com/reference/basic-api-usage/
- id: json-api
  conforms: false
  evidence: Responses use plain domain-shaped JSON, not the JSON:API document structure.
- id: odata
  conforms: false
- id: pagination
  conforms: true
  evidence: Offset pagination on the status-and-progress metrics endpoints via
    registration_offset and registrations_per_page with a next object in the response.
  source: https://dev.knewton.com/reference/status-and-progress/
- id: idempotency
  conforms: false
  evidence: No idempotency key header or request-replay contract is documented.
- id: rate-limit-headers
  conforms: partial
  evidence: 429 responses carry proprietary X-Knewton-Rate-Exceeded and X-Knewton-Rate-Delay
    headers; no RFC 9331 RateLimit headers and no Retry-After.
  source: https://dev.knewton.com/implementation/rate-limits/
